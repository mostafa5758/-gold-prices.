<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الذهب والعملات اليوم</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f4f6f9; text-align: center; padding: 20px; color: #333; }
        .card { background: white; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d4af37; }
        .price { font-size: 1.4rem; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>أسعار الذهب اليوم</h1>
        <p id="date"></p>
        <div class="price">عيار 24: <span id="g24">جاري التحميل...</span> جنيه</div>
        <div class="price">عيار 21: <span id="g21">جاري التحميل...</span> جنيه</div>
        <div class="price">سعر الدولار: <span id="usd">جاري التحميل...</span> جنيه</div>
    </div>

    <script>
        fetch('gold_data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('g24').innerText = data.gold_gram_24_egp;
                document.getElementById('g21').innerText = data.gold_gram_21_egp;
                document.getElementById('usd').innerText = data.usd_to_egp;
                document.getElementById('date').innerText = "آخر تحديث: " + new Date().toLocaleDateString('ar-EG');
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
